<meta charset="UTF-8">
<title>데이터 수집 - 연습용 화면</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --bg: #FAFAF9;
    --surface: #FFFFFF;
    --text: #18181B;
    --text-secondary: #71717A;
    --border: #E4E4E7;
    --accent: #6D5DFB;
    --accent-surface: #F4F3FF;
  }

  html, body {
    background: var(--bg);
  }

  body {
    color: var(--text);
    font-family: "Pretendard", "SUIT", "Noto Sans KR", "Inter", -apple-system,
      "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    margin: 0;
    padding: 0;
  }

  .page {
    max-width: 760px;
    margin: 0 auto;
    padding: 72px 24px 120px;
  }

  .notice {
    color: var(--text-secondary);
    font-size: 13px;
    letter-spacing: 0.01em;
    padding-left: 14px;
    border-left: 2px solid var(--border);
    margin-bottom: 40px;
  }

  h1.title {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
    margin: 0 0 24px;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 40px;
  }

  .field {
    margin-bottom: 20px;
  }
  .field:last-of-type {
    margin-bottom: 0;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 10px;
    letter-spacing: 0.01em;
  }

  textarea,
  input[type="number"],
  input[type="datetime-local"],
  select {
    font-family: inherit;
    font-size: 15px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    transition: border-color 0.15s ease;
  }
  textarea:focus,
  input[type="number"]:focus,
  input[type="datetime-local"]:focus,
  select:focus {
    outline: none;
    border-color: var(--accent);
  }

  textarea {
    width: 100%;
    height: 42px;
    min-height: 42px;
    line-height: 1.6;
    resize: none;
    overflow-y: hidden;
  }
  textarea::placeholder {
    color: #A1A1AA;
  }

  .period-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .period-sep {
    color: var(--text-secondary);
    font-size: 14px;
    flex-shrink: 0;
  }

  .datetime-combo {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: stretch;
    gap: 6px;
  }
  .datetime-text {
    flex: 1;
    min-width: 0;
    font-variant-numeric: tabular-nums;
  }
  .datetime-text.invalid {
    border-color: #E11D48;
  }
  button.calendar-btn {
    flex-shrink: 0;
    width: 42px;
    font-size: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
  }
  button.calendar-btn:hover {
    background: var(--accent-surface);
  }
  .datetime-picker-hidden {
    position: absolute;
    width: 0;
    height: 0;
    opacity: 0;
    pointer-events: none;
    border: 0;
    padding: 0;
  }

  button#collect-btn {
    display: inline-block;
    margin-top: 36px;
    padding: 11px 22px;
    font-size: 14px;
    font-weight: 600;
    color: #ffffff;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  button#collect-btn:hover {
    opacity: 0.88;
  }
  button#collect-btn:active {
    opacity: 0.78;
  }

  #result-section {
    display: none;
    margin-top: 16px;
  }
  #result-section .panel {
    padding: 40px;
  }
  #result-section h2.result-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    letter-spacing: 0.02em;
    margin: 0 0 24px;
    text-transform: uppercase;
  }

  .lang-hint {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 10px;
  }
  .lang-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .lang-grid label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 400;
    color: var(--text);
    margin-bottom: 0;
    cursor: pointer;
  }
  .lang-grid input[type="checkbox"] {
    accent-color: var(--accent);
    cursor: pointer;
  }
  .lang-actions {
    margin-top: 10px;
    display: flex;
    gap: 12px;
  }
  .lang-actions button {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    padding: 0;
  }

  .result-summary {
    font-size: 15px;
    line-height: 1.7;
    color: var(--text);
    margin-bottom: 20px;
  }
  .result-summary.loading {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text-secondary);
  }
  .spinner {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .accordion-item {
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 8px;
    overflow: hidden;
  }
  button.accordion-header {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 14px 16px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    background: var(--surface);
    border: none;
    text-align: left;
    cursor: pointer;
  }
  button.accordion-header:hover {
    background: var(--accent-surface);
  }
  .accordion-header .accordion-arrow {
    color: var(--text-secondary);
    font-size: 12px;
    flex-shrink: 0;
    width: 12px;
  }
  .accordion-header .accordion-warning {
    color: var(--text-secondary);
    font-weight: 400;
    font-size: 12.5px;
  }
  .accordion-body {
    padding: 4px 16px 16px;
    border-top: 1px solid var(--border);
  }
  .accordion-body-meta {
    font-size: 12.5px;
    color: var(--text-secondary);
    margin: 12px 0;
  }
  .evidence-row {
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .evidence-row:last-child {
    border-bottom: none;
  }
  .evidence-meta {
    font-size: 12.5px;
    color: var(--text-secondary);
    margin-bottom: 4px;
  }
  .evidence-text {
    font-size: 14px;
    line-height: 1.65;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
  }
</style>

<div class="page">

  <div class="notice">실제로 담당자를 부릅니다</div>

  <h1 class="title">데이터 수집</h1>

  <div class="panel">
    <div class="notice" style="margin-bottom: 20px;">대상 게임: PUBG: BATTLEGROUNDS(고정)</div>

    <div class="field">
      <label for="collect-period-start-text">게시물 등록기간(데이터 수집기간)</label>
      <div class="lang-hint">직접 숫자만 타이핑해도 됩니다(24시간제, 예: 2026년 8월 7일 오전 9시 → 202608070900). 달력 아이콘을 눌러 클릭으로 고를 수도 있습니다.</div>
      <div class="period-row">
        <div class="datetime-combo">
          <input type="text" id="collect-period-start-text" class="datetime-text" placeholder="YYYYMMDDHHmm" inputmode="numeric" maxlength="16">
          <button type="button" class="calendar-btn" data-picker="collect-period-start" aria-label="달력에서 선택">📅</button>
          <input type="datetime-local" id="collect-period-start" class="datetime-picker-hidden" tabindex="-1">
        </div>
        <span class="period-sep">~</span>
        <div class="datetime-combo">
          <input type="text" id="collect-period-end-text" class="datetime-text" placeholder="YYYYMMDDHHmm" inputmode="numeric" maxlength="16">
          <button type="button" class="calendar-btn" data-picker="collect-period-end" aria-label="달력에서 선택">📅</button>
          <input type="datetime-local" id="collect-period-end" class="datetime-picker-hidden" tabindex="-1">
        </div>
      </div>
    </div>

    <div class="field">
      <label>언어권 선택(스팀 리뷰, 중복 선택 가능)</label>
      <div class="lang-hint">최대 31개(전체 언어) 동시 조회 가능 — 선택한 언어는 전부 동시에 병렬로 긁어옵니다. 많이 선택해도 속도는 거의 그대로입니다.</div>
      <div class="lang-grid" id="lang-grid"></div>
      <div class="lang-actions">
        <button type="button" id="lang-select-all">전체 선택</button>
        <button type="button" id="lang-select-none">전체 해제</button>
      </div>
    </div>

    <button id="collect-btn">[데이터 수집]</button>
  </div>

  <div id="result-section">
    <div class="panel">
      <h2 class="result-title">결과</h2>
      <div id="result-summary" class="result-summary"></div>
      <div id="result-accordion"></div>
    </div>
  </div>

</div>

<script>
  function pad2(n) { return String(n).padStart(2, '0'); }

  function formatDigitsForDisplay(digits) {
    // digits: 최대 12자리 "YYYYMMDDHHmm" -> "YYYY-MM-DD HH:mm" 형태로 보기 좋게 표시
    var out = digits.slice(0, 4);
    if (digits.length > 4) out += '-' + digits.slice(4, 6);
    if (digits.length > 6) out += '-' + digits.slice(6, 8);
    if (digits.length > 8) out += ' ' + digits.slice(8, 10);
    if (digits.length > 10) out += ':' + digits.slice(10, 12);
    return out;
  }

  function digitsToNativeValue(digits) {
    // 12자리(YYYYMMDDHHmm) 다 채워졌을 때만 유효한 datetime-local 값으로 변환, 아니면 null
    if (digits.length !== 12) return null;
    var year = digits.slice(0, 4);
    var month = Number(digits.slice(4, 6));
    var day = Number(digits.slice(6, 8));
    var hour = Number(digits.slice(8, 10));
    var minute = Number(digits.slice(10, 12));
    if (month < 1 || month > 12) return null;
    if (day < 1 || day > 31) return null;
    if (hour > 23) return null;
    if (minute > 59) return null;
    // 00시=오전 0시부터 24시간제 그대로 해석 — 별도 오전/오후 입력 없음
    return year + '-' + pad2(month) + '-' + pad2(day) + 'T' + pad2(hour) + ':' + pad2(minute);
  }

  function nativeValueToDisplay(nativeValue) {
    // "YYYY-MM-DDTHH:mm" -> "YYYY-MM-DD HH:mm" (달력에서 고른 값을 텍스트 칸에 보여주기 위함)
    if (!nativeValue) return '';
    return nativeValue.replace('T', ' ');
  }

  function setupDateTimeCombo(id) {
    var textInput = document.getElementById(id + '-text');
    var nativeInput = document.getElementById(id);
    var calendarBtn = document.querySelector('button.calendar-btn[data-picker="' + id + '"]');

    textInput.addEventListener('input', function () {
      var digits = textInput.value.replace(/\D/g, '').slice(0, 12);
      var cursorWasAtEnd = textInput.selectionStart === textInput.value.length;
      textInput.value = formatDigitsForDisplay(digits);
      if (cursorWasAtEnd) {
        textInput.setSelectionRange(textInput.value.length, textInput.value.length);
      }
      var nativeValue = digitsToNativeValue(digits);
      if (nativeValue) {
        nativeInput.value = nativeValue;
        textInput.classList.remove('invalid');
      } else {
        nativeInput.value = '';
        textInput.classList.toggle('invalid', digits.length === 12);
      }
    });

    calendarBtn.addEventListener('click', function () {
      if (typeof nativeInput.showPicker === 'function') {
        nativeInput.showPicker();
      } else {
        nativeInput.focus();
      }
    });

    nativeInput.addEventListener('change', function () {
      textInput.value = nativeValueToDisplay(nativeInput.value);
      textInput.classList.remove('invalid');
    });
  }

  setupDateTimeCombo('collect-period-start');
  setupDateTimeCombo('collect-period-end');

  var STEAM_LANGUAGES = [
    { code: 'english', label: '영어' },
    { code: 'koreana', label: '한국어' },
    { code: 'japanese', label: '일본어' },
    { code: 'schinese', label: '중국어(간체)' },
    { code: 'tchinese', label: '중국어(번체)' },
    { code: 'russian', label: '러시아어' },
    { code: 'spanish', label: '스페인어' },
    { code: 'latam', label: '스페인어(중남미)' },
    { code: 'portuguese', label: '포르투갈어' },
    { code: 'brazilian', label: '포르투갈어(브라질)' },
    { code: 'french', label: '프랑스어' },
    { code: 'german', label: '독일어' },
    { code: 'italian', label: '이탈리아어' },
    { code: 'polish', label: '폴란드어' },
    { code: 'dutch', label: '네덜란드어' },
    { code: 'turkish', label: '터키어' },
    { code: 'thai', label: '태국어' },
    { code: 'vi', label: '베트남어' },
    { code: 'indonesian', label: '인도네시아어' },
    { code: 'malay', label: '말레이어' },
    { code: 'arabic', label: '아랍어' },
    { code: 'ukrainian', label: '우크라이나어' },
    { code: 'czech', label: '체코어' },
    { code: 'hungarian', label: '헝가리어' },
    { code: 'romanian', label: '루마니아어' },
    { code: 'bulgarian', label: '불가리아어' },
    { code: 'greek', label: '그리스어' },
    { code: 'swedish', label: '스웨덴어' },
    { code: 'danish', label: '덴마크어' },
    { code: 'finnish', label: '핀란드어' },
    { code: 'norwegian', label: '노르웨이어' }
  ];

  (function renderLangGrid() {
    var grid = document.getElementById('lang-grid');
    STEAM_LANGUAGES.forEach(function (lang) {
      var label = document.createElement('label');
      var checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.value = lang.code;
      checkbox.className = 'lang-checkbox';
      checkbox.checked = true;
      label.appendChild(checkbox);
      label.appendChild(document.createTextNode(lang.label));
      grid.appendChild(label);
    });
  })();

  document.getElementById('lang-select-all').addEventListener('click', function () {
    document.querySelectorAll('.lang-checkbox').forEach(function (cb) { cb.checked = true; });
  });
  document.getElementById('lang-select-none').addEventListener('click', function () {
    document.querySelectorAll('.lang-checkbox').forEach(function (cb) { cb.checked = false; });
  });

  function getSelectedLanguages() {
    return Array.prototype.slice.call(document.querySelectorAll('.lang-checkbox:checked')).map(function (cb) { return cb.value; });
  }

  var FIXED_GAME_NAME = 'PUBG: BATTLEGROUNDS';
  var LANG_LABEL = {};
  STEAM_LANGUAGES.forEach(function (l) { LANG_LABEL[l.code] = l.label; });

  function renderResult(data) {
    var summaryEl = document.getElementById('result-summary');
    var accordionEl = document.getElementById('result-accordion');
    summaryEl.classList.remove('loading');
    accordionEl.innerHTML = '';

    if (!data.found) {
      summaryEl.textContent = '게임을 찾지 못했습니다: ' + data.gameName;
      return;
    }
    if (data.dbMissing) {
      summaryEl.textContent = 'DB가 아직 없습니다. hy/collector.js를 먼저 실행해서 수집해야 합니다.';
      return;
    }

    summaryEl.textContent = data.matchedName + ' · 원본 ' + data.totalRaw + '건 → 짧은 리뷰 제거 + 중복 병합 후 최종 ' + data.totalFinal + '건';

    var evidenceByLang = {};
    data.evidence.forEach(function (item) {
      if (!evidenceByLang[item.language]) evidenceByLang[item.language] = [];
      evidenceByLang[item.language].push(item);
    });

    data.perLanguage.forEach(function (p) {
      var item = document.createElement('div');
      item.className = 'accordion-item';

      var header = document.createElement('button');
      header.type = 'button';
      header.className = 'accordion-header';
      var langName = LANG_LABEL[p.language] || p.language;
      header.innerHTML = '<span class="accordion-arrow">▸</span>' +
        '<span>' + langName + ' 총 ' + p.finalCount + '건</span>' +
        (p.collectionComplete ? '' : '<span class="accordion-warning">⚠️ 수집 미완료</span>');

      var body = document.createElement('div');
      body.className = 'accordion-body';
      body.hidden = true;
      var rendered = false;

      header.addEventListener('click', function () {
        var willOpen = body.hidden;
        body.hidden = !willOpen;
        header.querySelector('.accordion-arrow').textContent = willOpen ? '▾' : '▸';
        if (willOpen && !rendered) {
          rendered = true;
          var meta = document.createElement('div');
          meta.className = 'accordion-body-meta';
          meta.textContent = '원본 ' + p.rawInPeriod + '건 · 너무 짧아서 제외 ' + p.tooShortRemoved + '건 · 중복 병합 ' + p.duplicatesMerged + '건 · 최종 ' + p.finalCount + '건';
          body.appendChild(meta);

          var list = evidenceByLang[p.language] || [];
          list.forEach(function (r) {
            var row = document.createElement('div');
            row.className = 'evidence-row';
            var metaLine = document.createElement('div');
            metaLine.className = 'evidence-meta';
            var date = new Date(r.timestamp_created * 1000).toISOString().slice(0, 10);
            metaLine.textContent = date + ' · ' + (r.voted_up ? '추천' : '비추천') + (r.duplicateCount > 1 ? ' · 중복 ' + r.duplicateCount + '건 병합' : '');
            var textLine = document.createElement('div');
            textLine.className = 'evidence-text';
            textLine.textContent = r.review;
            row.appendChild(metaLine);
            row.appendChild(textLine);
            body.appendChild(row);
          });
        }
      });

      item.appendChild(header);
      item.appendChild(body);
      accordionEl.appendChild(item);
    });
  }

  document.getElementById('collect-btn').addEventListener('click', function () {
    var resultSection = document.getElementById('result-section');
    var summaryEl = document.getElementById('result-summary');
    var accordionEl = document.getElementById('result-accordion');
    var btn = document.getElementById('collect-btn');

    resultSection.style.display = 'block';
    resultSection.scrollIntoView({ behavior: 'smooth' });
    accordionEl.innerHTML = '';
    summaryEl.innerHTML = '<span class="spinner"></span><span>데이터 수집중</span>';
    summaryEl.classList.add('loading');
    btn.disabled = true;

    fetch('/evidence', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        gameName: FIXED_GAME_NAME,
        periodStartMs: new Date(document.getElementById('collect-period-start').value).getTime(),
        periodEndMs: new Date(document.getElementById('collect-period-end').value).getTime(),
        languages: getSelectedLanguages()
      })
    })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (r) {
        if (r.ok) {
          renderResult(r.data);
        } else {
          summaryEl.classList.remove('loading');
          summaryEl.textContent = '오류: ' + (r.data.error || '알 수 없는 오류');
        }
      })
      .catch(function (err) {
        summaryEl.classList.remove('loading');
        summaryEl.textContent = '오류: ' + err.message;
      })
      .finally(function () {
        btn.disabled = false;
      });
  });

</script>

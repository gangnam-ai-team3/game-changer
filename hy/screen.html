<meta charset="UTF-8">
<title>데이터 수집 - 연습용 화면</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --bg: #FAFAF9;
    --surface: #FFFFFF;
    --text: #18181B;
    --text-secondary: #71717A;
    --border: #E4E4E7;
    --accent: #6D5DFB;
    --accent-surface: #F4F3FF;
  }

  html, body {
    background: var(--bg);
  }

  body {
    color: var(--text);
    font-family: "Pretendard", "SUIT", "Noto Sans KR", "Inter", -apple-system,
      "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    margin: 0;
    padding: 0;
  }

  .page {
    max-width: 760px;
    margin: 0 auto;
    padding: 72px 24px 120px;
  }

  .notice {
    color: var(--text-secondary);
    font-size: 13px;
    letter-spacing: 0.01em;
    padding-left: 14px;
    border-left: 2px solid var(--border);
    margin-bottom: 40px;
  }

  h1.title {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
    margin: 0 0 24px;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 40px;
  }

  .field {
    margin-bottom: 20px;
  }
  .field:last-of-type {
    margin-bottom: 0;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 10px;
    letter-spacing: 0.01em;
  }

  textarea,
  input[type="number"],
  input[type="datetime-local"],
  select {
    font-family: inherit;
    font-size: 15px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    transition: border-color 0.15s ease;
  }
  textarea:focus,
  input[type="number"]:focus,
  input[type="datetime-local"]:focus,
  select:focus {
    outline: none;
    border-color: var(--accent);
  }

  textarea {
    width: 100%;
    height: 42px;
    min-height: 42px;
    line-height: 1.6;
    resize: none;
    overflow-y: hidden;
  }
  textarea::placeholder {
    color: #A1A1AA;
  }

  .period-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .period-sep {
    color: var(--text-secondary);
    font-size: 14px;
    flex-shrink: 0;
  }

  .datetime-combo {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: stretch;
    gap: 6px;
  }
  .datetime-text {
    flex: 1;
    min-width: 0;
    font-variant-numeric: tabular-nums;
  }
  .datetime-text.invalid {
    border-color: #E11D48;
  }
  button.calendar-btn {
    flex-shrink: 0;
    width: 42px;
    font-size: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
  }
  button.calendar-btn:hover {
    background: var(--accent-surface);
  }
  .datetime-picker-hidden {
    position: absolute;
    width: 0;
    height: 0;
    opacity: 0;
    pointer-events: none;
    border: 0;
    padding: 0;
  }

  .amount-row {
    display: flex;
    gap: 8px;
  }
  .amount-row input[type="number"] {
    flex: 1;
    min-width: 0;
  }
  .amount-row select {
    flex-shrink: 0;
    width: 100px;
    cursor: pointer;
  }

  .fx-note {
    margin-top: 8px;
    font-size: 13px;
    color: var(--text-secondary);
    min-height: 18px;
  }

  button#collect-btn {
    display: inline-block;
    margin-top: 36px;
    padding: 11px 22px;
    font-size: 14px;
    font-weight: 600;
    color: #ffffff;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  button#collect-btn:hover {
    opacity: 0.88;
  }
  button#collect-btn:active {
    opacity: 0.78;
  }


  #result-section {
    display: none;
    margin-top: 16px;
  }
  #result-section .panel {
    padding: 40px;
  }
  #result-section h2.result-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    letter-spacing: 0.02em;
    margin: 0 0 24px;
    text-transform: uppercase;
  }

  .result-body h1 {
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--text);
    margin: 0 0 16px;
  }
  .result-body h2 {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    margin: 40px 0 14px;
  }
  .result-body h2:first-of-type {
    margin-top: 32px;
  }
  .result-body h3 {
    font-size: 15px;
    font-weight: 600;
    margin: 24px 0 8px;
  }
  .result-body p {
    color: var(--text);
    margin: 8px 0;
    line-height: 1.75;
  }
  .result-body code {
    font-size: 0.92em;
    background: var(--accent-surface);
    color: var(--accent);
    padding: 1px 6px;
    border-radius: 5px;
  }
  .result-body ul {
    margin: 8px 0;
    padding-left: 20px;
  }
  .result-body li {
    margin: 6px 0;
    line-height: 1.7;
  }

  table {
    border-collapse: collapse;
    width: 100%;
    margin: 4px 0 8px;
    font-size: 14px;
  }
  th, td {
    border-bottom: 1px solid var(--border);
    padding: 11px 14px;
    text-align: left;
    vertical-align: top;
  }
  th {
    color: var(--text-secondary);
    font-weight: 600;
    font-size: 12.5px;
    letter-spacing: 0.02em;
    border-bottom: 1px solid var(--border);
    border-top: 1px solid var(--border);
  }
  tbody tr:last-child td {
    border-bottom: none;
  }
  .table-wrap {
    overflow-x: auto;
    margin: 4px 0 28px;
  }

  .lang-hint {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 10px;
  }
  .lang-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .lang-grid label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 400;
    color: var(--text);
    margin-bottom: 0;
    cursor: pointer;
  }
  .lang-grid input[type="checkbox"] {
    accent-color: var(--accent);
    cursor: pointer;
  }
  .lang-actions {
    margin-top: 10px;
    display: flex;
    gap: 12px;
  }
  .lang-actions button {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    padding: 0;
  }

  #result-output {
    margin: 0;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.75;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
  }
  #result-output.loading {
    color: var(--text-secondary);
  }
</style>

<div class="page">

  <div class="notice">실제로 담당자를 부릅니다</div>

  <h1 class="title">데이터 수집</h1>

  <div class="panel">
    <div class="notice" style="margin-bottom: 20px;">대상 게임: PUBG: BATTLEGROUNDS(고정)</div>

    <div class="field">
      <label for="event-keyword">이벤트 키워드</label>
      <textarea id="event-keyword" rows="1" placeholder="이벤트 키워드를 붙여넣으세요"></textarea>
    </div>

    <div class="field">
      <label for="collect-period-start-text">게시물 등록기간(데이터 수집기간)</label>
      <div class="lang-hint">직접 숫자만 타이핑해도 됩니다(24시간제, 예: 2026년 8월 7일 오전 9시 → 202608070900). 달력 아이콘을 눌러 클릭으로 고를 수도 있습니다.</div>
      <div class="period-row">
        <div class="datetime-combo">
          <input type="text" id="collect-period-start-text" class="datetime-text" placeholder="YYYYMMDDHHmm" inputmode="numeric" maxlength="16">
          <button type="button" class="calendar-btn" data-picker="collect-period-start" aria-label="달력에서 선택">📅</button>
          <input type="datetime-local" id="collect-period-start" class="datetime-picker-hidden" tabindex="-1">
        </div>
        <span class="period-sep">~</span>
        <div class="datetime-combo">
          <input type="text" id="collect-period-end-text" class="datetime-text" placeholder="YYYYMMDDHHmm" inputmode="numeric" maxlength="16">
          <button type="button" class="calendar-btn" data-picker="collect-period-end" aria-label="달력에서 선택">📅</button>
          <input type="datetime-local" id="collect-period-end" class="datetime-picker-hidden" tabindex="-1">
        </div>
      </div>
    </div>

    <div class="field">
      <label>언어권 선택(스팀 리뷰, 중복 선택 가능)</label>
      <div class="lang-hint">최대 31개(전체 언어) 동시 조회 가능 — 선택한 언어는 전부 동시에 병렬로 긁어옵니다. 많이 선택해도 속도는 거의 그대로입니다.</div>
      <div class="lang-grid" id="lang-grid"></div>
      <div class="lang-actions">
        <button type="button" id="lang-select-all">전체 선택</button>
        <button type="button" id="lang-select-none">전체 해제</button>
      </div>
    </div>

    <div class="field">
      <label for="cost-limit">상한 비용</label>
      <div class="amount-row">
        <input type="number" id="cost-limit" placeholder="상한 비용을 입력하세요" min="0" step="any">
        <select id="currency-select">
          <option value="USD" selected>USD</option>
          <option value="KRW">KRW</option>
          <option value="JPY">JPY</option>
          <option value="EUR">EUR</option>
          <option value="CNY">CNY</option>
        </select>
      </div>
      <div class="fx-note" id="fx-note"></div>
    </div>

    <button id="collect-btn">[데이터 수집]</button>
  </div>

  <div id="result-section">
    <div class="panel">
      <h2 class="result-title">결과</h2>
      <div class="result-body">
        <pre id="result-output"></pre>
      </div>
    </div>
  </div>

</div>

<script>
  function pad2(n) { return String(n).padStart(2, '0'); }

  function formatDigitsForDisplay(digits) {
    // digits: 최대 12자리 "YYYYMMDDHHmm" -> "YYYY-MM-DD HH:mm" 형태로 보기 좋게 표시
    var out = digits.slice(0, 4);
    if (digits.length > 4) out += '-' + digits.slice(4, 6);
    if (digits.length > 6) out += '-' + digits.slice(6, 8);
    if (digits.length > 8) out += ' ' + digits.slice(8, 10);
    if (digits.length > 10) out += ':' + digits.slice(10, 12);
    return out;
  }

  function digitsToNativeValue(digits) {
    // 12자리(YYYYMMDDHHmm) 다 채워졌을 때만 유효한 datetime-local 값으로 변환, 아니면 null
    if (digits.length !== 12) return null;
    var year = digits.slice(0, 4);
    var month = Number(digits.slice(4, 6));
    var day = Number(digits.slice(6, 8));
    var hour = Number(digits.slice(8, 10));
    var minute = Number(digits.slice(10, 12));
    if (month < 1 || month > 12) return null;
    if (day < 1 || day > 31) return null;
    if (hour > 23) return null;
    if (minute > 59) return null;
    // 00시=오전 0시부터 24시간제 그대로 해석 — 별도 오전/오후 입력 없음
    return year + '-' + pad2(month) + '-' + pad2(day) + 'T' + pad2(hour) + ':' + pad2(minute);
  }

  function nativeValueToDisplay(nativeValue) {
    // "YYYY-MM-DDTHH:mm" -> "YYYY-MM-DD HH:mm" (달력에서 고른 값을 텍스트 칸에 보여주기 위함)
    if (!nativeValue) return '';
    return nativeValue.replace('T', ' ');
  }

  function setupDateTimeCombo(id) {
    var textInput = document.getElementById(id + '-text');
    var nativeInput = document.getElementById(id);
    var calendarBtn = document.querySelector('button.calendar-btn[data-picker="' + id + '"]');

    textInput.addEventListener('input', function () {
      var digits = textInput.value.replace(/\D/g, '').slice(0, 12);
      var cursorWasAtEnd = textInput.selectionStart === textInput.value.length;
      textInput.value = formatDigitsForDisplay(digits);
      if (cursorWasAtEnd) {
        textInput.setSelectionRange(textInput.value.length, textInput.value.length);
      }
      var nativeValue = digitsToNativeValue(digits);
      if (nativeValue) {
        nativeInput.value = nativeValue;
        textInput.classList.remove('invalid');
      } else {
        nativeInput.value = '';
        textInput.classList.toggle('invalid', digits.length === 12);
      }
    });

    calendarBtn.addEventListener('click', function () {
      if (typeof nativeInput.showPicker === 'function') {
        nativeInput.showPicker();
      } else {
        nativeInput.focus();
      }
    });

    nativeInput.addEventListener('change', function () {
      textInput.value = nativeValueToDisplay(nativeInput.value);
      textInput.classList.remove('invalid');
    });
  }

  setupDateTimeCombo('collect-period-start');
  setupDateTimeCombo('collect-period-end');

  var STEAM_LANGUAGES = [
    { code: 'english', label: '영어' },
    { code: 'koreana', label: '한국어' },
    { code: 'japanese', label: '일본어' },
    { code: 'schinese', label: '중국어(간체)' },
    { code: 'tchinese', label: '중국어(번체)' },
    { code: 'russian', label: '러시아어' },
    { code: 'spanish', label: '스페인어' },
    { code: 'latam', label: '스페인어(중남미)' },
    { code: 'portuguese', label: '포르투갈어' },
    { code: 'brazilian', label: '포르투갈어(브라질)' },
    { code: 'french', label: '프랑스어' },
    { code: 'german', label: '독일어' },
    { code: 'italian', label: '이탈리아어' },
    { code: 'polish', label: '폴란드어' },
    { code: 'dutch', label: '네덜란드어' },
    { code: 'turkish', label: '터키어' },
    { code: 'thai', label: '태국어' },
    { code: 'vi', label: '베트남어' },
    { code: 'indonesian', label: '인도네시아어' },
    { code: 'malay', label: '말레이어' },
    { code: 'arabic', label: '아랍어' },
    { code: 'ukrainian', label: '우크라이나어' },
    { code: 'czech', label: '체코어' },
    { code: 'hungarian', label: '헝가리어' },
    { code: 'romanian', label: '루마니아어' },
    { code: 'bulgarian', label: '불가리아어' },
    { code: 'greek', label: '그리스어' },
    { code: 'swedish', label: '스웨덴어' },
    { code: 'danish', label: '덴마크어' },
    { code: 'finnish', label: '핀란드어' },
    { code: 'norwegian', label: '노르웨이어' }
  ];

  (function renderLangGrid() {
    var grid = document.getElementById('lang-grid');
    STEAM_LANGUAGES.forEach(function (lang) {
      var label = document.createElement('label');
      var checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.value = lang.code;
      checkbox.className = 'lang-checkbox';
      checkbox.checked = true;
      label.appendChild(checkbox);
      label.appendChild(document.createTextNode(lang.label));
      grid.appendChild(label);
    });
  })();

  document.getElementById('lang-select-all').addEventListener('click', function () {
    document.querySelectorAll('.lang-checkbox').forEach(function (cb) { cb.checked = true; });
  });
  document.getElementById('lang-select-none').addEventListener('click', function () {
    document.querySelectorAll('.lang-checkbox').forEach(function (cb) { cb.checked = false; });
  });

  function getSelectedLanguages() {
    return Array.prototype.slice.call(document.querySelectorAll('.lang-checkbox:checked')).map(function (cb) { return cb.value; });
  }

  var FIXED_GAME_NAME = 'PUBG: BATTLEGROUNDS';

  function buildInputText() {
    var lines = [];
    lines.push('대상 게임: ' + FIXED_GAME_NAME);
    lines.push('이벤트ID/키워드: ' + document.getElementById('event-keyword').value);
    lines.push('수집 기간: ' + document.getElementById('collect-period-start').value + ' ~ ' + document.getElementById('collect-period-end').value);
    lines.push('비용 상한: ' + document.getElementById('cost-limit').value + ' ' + document.getElementById('currency-select').value);
    return lines.join('\n');
  }

  document.getElementById('collect-btn').addEventListener('click', function () {
    var resultSection = document.getElementById('result-section');
    var resultOutput = document.getElementById('result-output');
    var btn = document.getElementById('collect-btn');

    resultSection.style.display = 'block';
    resultSection.scrollIntoView({ behavior: 'smooth' });
    resultOutput.textContent = '부르는 중...';
    resultOutput.classList.add('loading');
    btn.disabled = true;

    fetch('/call-agent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        text: buildInputText(),
        costLimitAmount: parseFloat(document.getElementById('cost-limit').value),
        costLimitCurrency: document.getElementById('currency-select').value,
        gameName: FIXED_GAME_NAME,
        periodStartMs: new Date(document.getElementById('collect-period-start').value).getTime(),
        periodEndMs: new Date(document.getElementById('collect-period-end').value).getTime(),
        languages: getSelectedLanguages()
      })
    })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (r) {
        resultOutput.classList.remove('loading');
        if (r.ok) {
          resultOutput.textContent = r.data.result;
        } else {
          resultOutput.textContent = '오류: ' + (r.data.error || '알 수 없는 오류');
        }
      })
      .catch(function (err) {
        resultOutput.classList.remove('loading');
        resultOutput.textContent = '오류: ' + err.message;
      })
      .finally(function () {
        btn.disabled = false;
      });
  });

  function autoGrow(el) {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }
  ['event-keyword'].forEach(function (id) {
    var el = document.getElementById(id);
    el.addEventListener('input', function () { autoGrow(el); });
  });

  // 고정 환율(예시값, 오프라인 파일이라 실시간 환율을 받아오지 않음) — 1단위당 원화
  var FX_RATES_TO_KRW = { USD: 1380, JPY: 9.2, EUR: 1490, CNY: 190 };
  var costInput = document.getElementById('cost-limit');
  var currencySelect = document.getElementById('currency-select');
  var fxNote = document.getElementById('fx-note');

  function updateFxNote() {
    var currency = currencySelect.value;
    var amount = parseFloat(costInput.value);
    if (currency === 'KRW' || costInput.value.trim() === '' || isNaN(amount)) {
      fxNote.textContent = '';
      return;
    }
    var rate = FX_RATES_TO_KRW[currency];
    var krw = Math.round(amount * rate);
    fxNote.textContent = '약 ' + krw.toLocaleString('ko-KR') + '원 (고정 환율 1 ' + currency + ' = ' + rate.toLocaleString('ko-KR') + '원 기준, 예시 값)';
  }
  costInput.addEventListener('input', updateFxNote);
  currencySelect.addEventListener('change', updateFxNote);
</script>
